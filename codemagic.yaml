workflows:
  android-build:
    name: Multi2 Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Generate Gradle wrapper
        script: gradle wrapper --gradle-version 8.10.2 --distribution-type bin
      - name: Build APK (release)
        script: ./gradlew assembleRelease --no-daemon
      - name: Build APK (debug)
        script: ./gradlew assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/**/*.apk
